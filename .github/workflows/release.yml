name: Build and Release Johnny CyberSuite X

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Node dependencies
        run: npm install

      - name: Run backend tests
        run: |
          source backend/venv/bin/activate
          pytest tests

      - name: Build Electron packages
        run: npm run build -- --publish never

        - name: Verify build artifacts
          run: |
          echo "Checking release files..."
          ls -lh dist

          echo "=== linux-unpacked ==="
          du -sh dist/linux-unpacked/*

          echo "=== resources ==="
          du -sh dist/linux-unpacked/resources/*

          echo "=== largest files ==="
          find dist/linux-unpacked -type f -printf "%s %p\n" | sort -nr | head -20

          test -f dist/*.AppImage
          test -f dist/*.deb

          echo "Artifacts verified successfully."
