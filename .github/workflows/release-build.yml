name: Release Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Build Electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build

      - name: Validate artifacts
        run: |
          ls -lah dist
          test -f dist/*.AppImage
          test -f dist/*.deb
          test -d dist/linux-unpacked
          test -d dist/linux-unpacked/resources/backend
          test -f dist/linux-unpacked/resources/app.asar

      - name: Run tests
        run: pytest tests -v
